databases:
  - name: career-assistant-db
    plan: basic-256mb
    region: oregon
    databaseName: career
    user: career

services:
  - type: web
    name: career-assistant-api
    runtime: docker
    plan: starter
    region: oregon
    rootDir: Career-Assistant-source/career-assistant/backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: career-assistant-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://jobsearchandtracker.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_HOURS
        value: "24"
      - key: STORAGE_DIR
        value: /app/data/files
      - key: PYTHON_VERSION
        value: 3.12.10
  - type: worker
    name: career-assistant-worker
    runtime: docker
    plan: starter
    region: oregon
    rootDir: Career-Assistant-source/career-assistant/backend
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.worker
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: career-assistant-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://jobsearchandtracker.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_HOURS
        value: "24"
      - key: STORAGE_DIR
        value: /app/data/files
      - key: PYTHON_VERSION
        value: 3.12.10
