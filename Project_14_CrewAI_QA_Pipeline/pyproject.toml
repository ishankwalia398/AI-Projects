[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jira-qa-crew"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "crewai[google-genai,litellm,tools]==1.15.18",
  "httpx==0.28.1",
  "pandas==2.2.3",
  "pydantic>=2.11.9,<3",
  "python-dotenv>=1.1.1,<2",
  "PyYAML==6.0.2",
  "streamlit==1.63.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.9.7", "mypy==1.15.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/jira_qa_crew"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires live credentials"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "E701", "E702", "S101"]
