databases:
  - name: career-assistant-db
    plan: free
    region: oregon
    databaseName: career
    user: career

services:
  - type: web
    name: career-assistant-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: Project_21_Career-Assistant-source/career-assistant/backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: career-assistant-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://jobsearchandtracker.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_HOURS
        value: "24"
      - key: STORAGE_DIR
        value: /app/data/files
      - key: INLINE_WORKER
        value: "true"
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
